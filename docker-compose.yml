services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sudoku
      POSTGRES_PASSWORD: sudoku
      POSTGRES_DB: sudoku_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sudoku -d sudoku_development"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DB_HOST: db
      DB_USER: sudoku
      DB_PASSWORD: sudoku
      DB_NAME: sudoku_development
      FRONTEND_ORIGIN: http://localhost:5173
      RAILS_ENV: development
      SECRET_KEY_BASE: sudoku-demo-session-secret-key-base-change-before-production-0123456789abcdef0123456789abcdef
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  frontend_node_modules:
